[Service]
# 2026-09-26: MemoryHigh=768M pinned the rescore and it swapped ~2.2G
# (iowait ~15%). Raised live, RSS pinned at 4.00G and the job reached
# the tape scan before a sealed-file race. High=4G Max=5G covers that pin.
# It waits out mal-laya-v0 so this 5G is not held on top of the 11G fit.
ExecStartPre=-/bin/bash -c 'for _ in $(seq 1 1080); do state=$(timeout 5 systemctl --user is-active mal-laya-v0.service 2>/dev/null || true); case "$state" in active|activating) sleep 10;; *) exit 0;; esac; done'
MemoryHigh=4G
MemoryMax=5G
# Do not borrow the 4G swapfile. The 2026-09-26 run pinned memory.high and swapped ~4G.
MemorySwapMax=0
# 2026-09-27: uncapped, the rescore pushed runner lag to 7.8s at 4.7G.
CPUQuota=50%
CPUWeight=10
OOMScoreAdjust=500
