[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Slice=mal-batch.slice
MemoryHigh=3G
MemoryMax=4G
# Weight alone did not keep forward-paper inside the 5s cap (2026-09-27).
# 50% is half of one core. Idle IO stays; do not raise the runner to compensate.
CPUWeight=10
CPUQuota=50%
Nice=19
IOSchedulingClass=idle
OOMScoreAdjust=1000
OOMPolicy=stop
