[Service]
# mal-laya-v0.timer starts this unit, so the daily fit and the
# graduated-swing child inherit these limits.
Slice=mal-batch.slice
# 6G high forced reclaim/swap while the host still had free RAM. 7G starts
# reclaim before the 8G kill. A full backfill re-score needs more than 8G;
# that one-shot is not this daily unit.
MemoryHigh=7G
MemoryMax=8G
CPUQuota=200%
OOMScoreAdjust=400
OOMPolicy=stop
