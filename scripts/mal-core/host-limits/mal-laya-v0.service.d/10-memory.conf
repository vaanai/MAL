[Unit]
# Stop backfill before the fit so its 4G cap is not held during training.
Conflicts=mal-pump-backfill.service
# ExecStopPost's --no-block start is queued while this unit is still
# deactivating, and Conflicts= can drop that start. OnSuccess/OnFailure
# run only after this unit is inactive, including OOM (OOMPolicy=stop).
OnSuccess=mal-pump-backfill-resume.service
OnFailure=mal-pump-backfill-resume.service

[Service]
# mal-laya-v0.timer starts this unit, so the daily fit and the
# graduated-swing child inherit these limits.
# --no-block: a synchronous systemctl --user call from this user
# manager deadlocks the start job. Conflicts= orders the stop in the
# same transaction. ExecStopPost still queues a start; the resume unit
# starts backfill again if that queued start was cancelled.
ExecStartPre=-/usr/bin/systemctl --user stop --no-block mal-pump-backfill.service
ExecStopPost=-/usr/bin/systemctl --user start --no-block mal-pump-backfill.service
Slice=mal-batch.slice
# 11G matches the 11.0G re-score peak. High is 10G so reclaim starts first.
MemoryHigh=10G
MemoryMax=11G
CPUQuota=200%
CPUWeight=10
Nice=19
IOSchedulingClass=idle
OOMScoreAdjust=400
OOMPolicy=stop
