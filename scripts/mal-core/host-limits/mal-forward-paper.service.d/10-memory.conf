[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Slice=mal-batch.slice
# 2026-09-26 cgroup ~806 MiB plus 122 MiB swap while High was 768M. Max stays 1G.
MemoryHigh=1G
MemoryMax=1G
CPUWeight=1000
Nice=0
IOSchedulingClass=best-effort
IOSchedulingPriority=0
OOMScoreAdjust=100
OOMPolicy=stop
