[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Slice=mal-batch.slice
# 2026-09-27: Max 1G swapped about 1G and left the runner in folio waits,
# lag stuck near 30s. High 2G / max 3G holds that working set in RAM.
MemoryHigh=2G
MemoryMax=3G
CPUWeight=1000
Nice=0
IOSchedulingClass=best-effort
IOSchedulingPriority=0
OOMScoreAdjust=100
OOMPolicy=stop
