[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Slice=mal-batch.slice
# 2026-09-27: Max 1G swapped about 1G. Raised to 3G, then the working set
# reached ~4G (2G resident + 2G swap) and lag stuck over 40s.
# High 5G / max 6G holds that set in RAM.
MemoryHigh=5G
MemoryMax=6G
CPUWeight=1000
Nice=0
IOSchedulingClass=best-effort
IOSchedulingPriority=0
OOMScoreAdjust=100
OOMPolicy=stop
