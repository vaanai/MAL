# HV4 C0 bridge LIVE switch (DEC-032), PINNED. NOT installed by default and NOT installed by merging this file. It is the ONLY thing that hands the bridge a
# key (systemd LoadCredential under the name the code reads, probe-wallet; the source is the per-bot canary wallet Helm generated, root:root 0400 in
# root:root 0700 /etc/mal-hv4-c0-key) and an RPC key (the fast host's Helius env file; the NAME of the variable is checked, the line is never printed).
# Install it per instance, only on the owner's word and only from the manifest-verified root-owned copy in the sha dir, never from a working tree:
#   sudo install -D -m 0644 /opt/mal-arena-bridge/<sha>/scripts/mal-fast/hv4-c0/mal-hv4-c0-bridge-live-pinned.conf \
#        /etc/systemd/system/mal-hv4-c0-bridge@<bot_id>.service.d/live.conf
# Live still needs ALL of: --live below AND "mode": "live" in /etc/mal-arena-live/hv4-c0-<bot_id>.live.json, the bot's LIVE_OK naming the bot_id,
# /etc/mal-arena-live/TIER = T1, the owner-confirmation file for the bot, a recorded PASS read for the bot, the A3 carry, the parity/twin/tie-out chain,
# and a code head from which the hv4_c0_incomplete refusal has been removed by its own reviewed diff. See docs/runbooks/hv4-c0-bridge.md.
# Also live (Helm, once per host, as for C1-NF step 3b): the unit's user needs search-only access to /var/lib/mal-live (the wallet-wide STOP/HALT are tested
# there and the probe's state files are read by the start precheck): setfacl -m u:mal-hv4-c0:--x /var/lib/mal-live
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
PrivateNetwork=false
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
EnvironmentFile=/var/lib/mal/fast-listener/helius.env
LoadCredential=probe-wallet:/etc/mal-hv4-c0-key/%i.json
ExecStart=
ExecStart=/opt/mal-arena-bridge/venv/bin/python -E -s -B -u -m tools.arena_live_bridge --config /etc/mal-arena-live/hv4-c0-%i.live.json --live
