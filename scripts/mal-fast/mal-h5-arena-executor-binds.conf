# TEMPLATE for the read-only binds of the arena canary unit (Helm fills in the four host paths; unchanged, it is an invalid unit file on purpose).
# The unit sees /home as an empty tmpfs (ProtectHome=tmpfs), so exactly these job-user directories are bound read-only to fixed in-unit paths, which are
# the config values of dry.json / live.json. A leading "-" is NOT used: a missing source fails the start (the executor would only refuse later).
#   __FEED_DIR__    the book's arena shadow dir (e.g. /home/claude/data/arena/h5-2026-10-22)       -> intents_file   /srv/mal-h5-arena/feed
#   __A3_DIR__      the fast-0 A3 guard output dir (/home/claude/data/structure-monitor)           -> a3_record_file /srv/mal-h5-arena/a3/daily.jsonl
#   __TWINS_DIR__   the twin-writer job's output dir (twins.jsonl + twins.jsonl.run.json)          -> parity_twins_file /srv/mal-h5-arena/twins/twins.jsonl
#   __TIEOUT_DIR__  the daily tie-out job's RESULTS_DIR (tieout-<day>.json, EXCLUDED-TRIPS-<day>.json) -> tieout_dir   /srv/mal-h5-arena/tieout
[Service]
BindReadOnlyPaths=__FEED_DIR__:/srv/mal-h5-arena/feed
BindReadOnlyPaths=__A3_DIR__:/srv/mal-h5-arena/a3
BindReadOnlyPaths=__TWINS_DIR__:/srv/mal-h5-arena/twins
BindReadOnlyPaths=__TIEOUT_DIR__:/srv/mal-h5-arena/tieout
