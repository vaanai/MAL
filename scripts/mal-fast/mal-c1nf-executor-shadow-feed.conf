# TEMPLATE for the C1-NF shadow-feed bind (Helm fills in the one host path; unchanged, it is an invalid unit file on purpose).
# The C1-NF shadow (#503, a MiScusi job) writes its pick files into a directory under the job user's home. The unit sees /home as
# an empty tmpfs (ProtectHome=tmpfs), so that ONE directory is bound read-only to the fixed in-unit path /srv/mal-c1nf-shadow,
# which is the "intents_file" of both pinned configs. mal-c1nf gets read access and no write access: the bind is read-only, and
# the directory must not be group/world-writable. The leading "-" makes a missing source a silent no-op at the unit level (the
# executor then sees no feed and buys nothing).
#   sed 's#__SHADOW_DIR__#/home/<jobuser>/data/c1nf-shadow#' /usr/local/lib/mal-c1nf-exec/<sha>/mal-c1nf-executor-shadow-feed.conf \
#     | sudo tee /etc/systemd/system/mal-c1nf-executor.service.d/10-shadow-feed.conf >/dev/null
#   python3 -I /usr/local/lib/mal-c1nf-exec/<sha>/check-c1nf-unit.py --shadow-feed /etc/systemd/system/mal-c1nf-executor.service.d/10-shadow-feed.conf
# The checker accepts exactly one BindReadOnlyPaths line whose source is /home/<user>/.../c1nf-shadow* with no hidden component.
[Service]
BindReadOnlyPaths=-__SHADOW_DIR__:/srv/mal-c1nf-shadow
