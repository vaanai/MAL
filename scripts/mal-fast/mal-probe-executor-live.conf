# DEC-019 LIVE switch for mal-probe-executor. NOT installed by default. Helm or the owner installs it:
#   sudo install -D -m 0644 scripts/mal-fast/mal-probe-executor-live.conf /etc/systemd/system/mal-probe-executor.service.d/live.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mal-probe-executor
# Remove the file and restart to go back to dry run. Live needs BOTH switches: the --live flag below AND
# "mode": "live" in probe-executor-live.json (the unit's own probe-executor.json stays "dryrun").
# The key stays root:root 0400 in /etc/mal-probe (root 0700). systemd hands it to this service as a private
# credential ($CREDENTIALS_DIRECTORY/probe-wallet); the executor reads only that. The dry-run unit has no
# LoadCredential.
[Service]
LoadCredential=probe-wallet:/etc/mal-probe/probe-wallet.json
ExecStart=
ExecStart=/var/lib/mal/fast-forward/venv/bin/python -m tools.probe_executor --config /var/lib/mal/fast-forward/src/scripts/mal-fast/probe-executor-live.json --live
LimitCORE=0
