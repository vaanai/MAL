# TEMPLATE for the CAP-PICK oracle bind (DEC-026 Amendment 1 item B; Helm fills in the one host path; unchanged, it is an invalid unit file on purpose).
# The CAP-PICK exporter (#509: scripts/research/cap-pick-oracle.sh, a MiScusi job) writes picks.jsonl into its CAP_PICK_OUT directory, which is
# under the job user's home. The unit sees /home as an empty tmpfs (ProtectHome=tmpfs), so that ONE directory is bound read-only to the fixed
# in-unit path /srv/mal-cap-pick. The pinned live config's "pick_file" is /srv/mal-cap-pick/picks.jsonl. mal-live gets read access and no
# write access: the bind is read-only, and the directory must not be group/world-writable. The leading "-" makes a missing source a silent
# no-op at the unit level; from 2026-10-16T01Z the executor then has no readable oracle file and refuses every buy (fail closed). The source
# directory must exist before the unit starts: one created later is not seen until a restart. The same pattern as the shadow-feed bind.
#   sed 's#__CAP_PICK_DIR__#/home/<jobuser>/data/h5-shadow/cap-pick#' /usr/local/lib/mal-c1nf-exec/<sha>/mal-c1nf-executor-cap-pick.conf \
#     | sudo tee /etc/systemd/system/mal-c1nf-executor.service.d/20-cap-pick.conf >/dev/null
#   python3 -I /usr/local/lib/mal-c1nf-exec/<sha>/check-c1nf-unit.py --cap-pick /etc/systemd/system/mal-c1nf-executor.service.d/20-cap-pick.conf
# The checker accepts exactly one BindReadOnlyPaths line whose source is /home/<user>/.../cap-pick* with no hidden component.
[Service]
BindReadOnlyPaths=-__CAP_PICK_DIR__:/srv/mal-cap-pick
