# DEC-019 LIVE switch, PINNED variant. NOT installed by default. Replaces live.conf (do not install both;
# they are the same file name in the drop-in dir). Runs the executor from the root-owned pinned copy that
# scripts/mal-fast/install-probe-executor-pinned.sh puts in /usr/local/lib/mal-probe-exec (nothing in it is
# writable by ubuntu or by agents), with the root-owned venv. See docs/runbooks/probe-executor.md section 2b.
#   sudo install -D -m 0644 scripts/mal-fast/mal-probe-executor-live-pinned.conf /etc/systemd/system/mal-probe-executor.service.d/live.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mal-probe-executor
# Live still needs BOTH switches: --live below AND "mode": "live" in the pinned probe-executor-live.json.
# Why a launcher and not `-m tools.probe_executor`: -I ignores PYTHONPATH (and the working directory), so
# `-m` could not find the pinned tools package at all, and setting PYTHONPATH would only mislead. The launcher
# is a root-owned file in the pinned dir that inserts its own resolved directory into sys.path (nothing else)
# and runs the module. -B: the pinned tree is read-only, write no bytecode. -u: -I also drops the
# PYTHONUNBUFFERED env of the base unit, so unbuffer the journal output here.
# The credential, state dir, signals bind and every hardening line are inherited from the base unit.
[Service]
LoadCredential=probe-wallet:/etc/mal-probe/probe-wallet.json
WorkingDirectory=/usr/local/lib/mal-probe-exec/current
ReadOnlyPaths=/usr/local/lib/mal-probe-exec
ExecStart=
ExecStart=/usr/local/lib/mal-probe-exec/venv/bin/python -I -B -u /usr/local/lib/mal-probe-exec/current/launcher.py --config /usr/local/lib/mal-probe-exec/current/probe-executor-live.json --live
LimitCORE=0
