# TEMPLATE for the shadow-feed bind (Helm fills in the one host path; unchanged, it is an invalid unit file on purpose).
# The shadow detector (tools/h5_shadow.py, a MiScusi job) writes hourly h5-shadow-<UTC hour>.jsonl files into a directory under
# the job user's home. The unit sees /home as an empty tmpfs (ProtectHome=tmpfs), so that ONE directory is bound read-only to the
# fixed in-unit path /srv/mal-h5-shadow, which is the "intents_file" of both pinned configs. mal-live gets read access and no
# write access: the bind is read-only, and the directory must not be group/world-writable. The leading "-" makes a missing
# source a silent no-op at the unit level (the executor then reports signals_absent and buys nothing).
#   sed 's#__SHADOW_DIR__#/home/<jobuser>/data/h5-shadow#' /usr/local/lib/mal-h5-exec/<sha>/mal-h5-executor-shadow-feed.conf \
#     | sudo tee /etc/systemd/system/mal-h5-executor.service.d/10-shadow-feed.conf >/dev/null
#   python3 -I /usr/local/lib/mal-h5-exec/<sha>/check-h5-unit.py --shadow-feed /etc/systemd/system/mal-h5-executor.service.d/10-shadow-feed.conf
# The checker accepts exactly one BindReadOnlyPaths line whose source is /home/<user>/.../h5-shadow* with no hidden component.
[Service]
BindReadOnlyPaths=-__SHADOW_DIR__:/srv/mal-h5-shadow
