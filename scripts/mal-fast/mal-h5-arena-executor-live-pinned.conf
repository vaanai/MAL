# H5 ARENA canary LIVE switch (DEC-032), PINNED. NOT installed by default and NOT installed by merging this file. It is the ONLY thing that hands the
# executor a key (systemd LoadCredential under the name the code reads, probe-wallet; the source is the canary wallet Helm generated, root:root 0400 in
# root:root 0700 /etc/mal-h5-arena-key). Install it from the manifest-verified root-owned copy in the sha dir, never from a working tree:
#   sudo install -D -m 0644 /usr/local/lib/mal-h5-arena-exec/<sha>/mal-h5-arena-executor-live-pinned.conf /etc/systemd/system/mal-h5-arena-executor.service.d/live.conf
# Live still needs ALL of: --live below AND "mode": "live" in /etc/mal-h5-arena/live.json, /etc/mal-h5/LIVE_OK, /etc/mal-h5-arena/LIVE_OK naming the
# bot_id, /etc/mal-h5-arena/TIER = T1, the merged canary DEC copy's OWNER_CANARY_CONFIRMED line, FEED_NOTE_MERGED True in the code. See HELM-SHEET.
[Service]
LoadCredential=probe-wallet:/etc/mal-h5-arena-key/canary-wallet.json
ExecStart=
ExecStart=/usr/local/lib/mal-h5-arena-exec/venv/bin/python -I -B -u /usr/local/lib/mal-h5-arena-exec/current/launcher.py --config /etc/mal-h5-arena/live.json --live
