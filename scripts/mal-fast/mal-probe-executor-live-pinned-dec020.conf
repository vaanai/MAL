# DEC-020 LIVE switch, PINNED variant (0.25 SOL step). NOT installed by default. NOT installed by merging this file.
# Replaces live.conf (do not install both; same file name in the drop-in dir). It differs from
# mal-probe-executor-live-pinned.conf ONLY in --config (probe-executor-live-dec020.json). The executor refuses at startup
# until the owner end instant is in code (DEC020_END_MS) and in that config, and while the dec019 live state shows any
# open or pending position. Install it FROM THE MANIFEST-VERIFIED ROOT-OWNED COPY the pinned installer puts in the sha
# dir (this file is in the installer's EXTRA list, so its sha256 is checked), not from a working tree:
#   sudo install -D -m 0644 /usr/local/lib/mal-probe-exec/<sha>/mal-probe-executor-live-pinned-dec020.conf /etc/systemd/system/mal-probe-executor.service.d/live.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mal-probe-executor
# Live still needs BOTH switches: --live below AND "mode": "live" in the pinned probe-executor-live-dec020.json.
# See docs/runbooks/probe-executor.md section 2b-dec020.
# Why a launcher and not `-m tools.probe_executor`: -I ignores PYTHONPATH (and the working directory), so
# `-m` could not find the pinned tools package at all, and setting PYTHONPATH would only mislead. The launcher
# is a root-owned file in the pinned dir that inserts its own resolved directory into sys.path (nothing else)
# and runs the module. -B: the pinned tree is read-only, write no bytecode. -u: -I also drops the
# PYTHONUNBUFFERED env of the base unit, so unbuffer the journal output here.
# The credential, state dir, signals bind and every hardening line are inherited from the base unit.
[Service]
LoadCredential=probe-wallet:/etc/mal-probe/probe-wallet.json
WorkingDirectory=/usr/local/lib/mal-probe-exec/current
ReadOnlyPaths=/usr/local/lib/mal-probe-exec
ExecStart=
ExecStart=/usr/local/lib/mal-probe-exec/venv/bin/python -I -B -u /usr/local/lib/mal-probe-exec/current/launcher.py --config /usr/local/lib/mal-probe-exec/current/probe-executor-live-dec020.json --live
LimitCORE=0
