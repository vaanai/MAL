# C1-NF LIVE switch (DEC-026), PINNED. NOT installed by default and NOT installed by merging this file. It is the ONLY thing that
# hands the executor the SECOND wallet's key (systemd LoadCredential; tools/c1nf_executor.py loads $CREDENTIALS_DIRECTORY/c1nf-wallet
# and nothing else, there is no path override). It never names H5's probe-wallet. Install it FROM THE MANIFEST-VERIFIED ROOT-OWNED
# COPY the pinned installer puts in the sha dir (its sha256 is in the manifest), never from a working tree:
#   sudo install -D -m 0644 /usr/local/lib/mal-c1nf-exec/<sha>/mal-c1nf-executor-live-pinned.conf /etc/systemd/system/mal-c1nf-executor.service.d/live.conf
#   sudo systemctl daemon-reload
# Live still needs BOTH switches: --live below AND "mode": "live" in the pinned c1nf-executor-live.json, plus /etc/mal-c1nf/LIVE_OK,
# EXP-025 Part 1 in the pinned tree and an explicit end_ms in that config. See docs/runbooks/c1nf-executor.md.
# The user, EnvironmentFile, state dir, mounts and every hardening line are inherited from the base unit.
[Service]
LoadCredential=c1nf-wallet:/etc/mal-c1nf-key/c1nf-wallet.json
ExecStart=
ExecStart=/usr/local/lib/mal-c1nf-exec/venv/bin/python -I -B -u /usr/local/lib/mal-c1nf-exec/current/launcher.py --config /usr/local/lib/mal-c1nf-exec/current/c1nf-executor-live.json --live
