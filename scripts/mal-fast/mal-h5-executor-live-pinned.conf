# H5 LIVE switch (DEC-024), PINNED. NOT installed by default and NOT installed by merging this file. It is the ONLY thing that
# hands the executor the probe wallet key (systemd LoadCredential; the executor loads $CREDENTIALS_DIRECTORY/probe-wallet and
# nothing else, there is no path override). Install it FROM THE MANIFEST-VERIFIED ROOT-OWNED COPY the pinned installer puts in
# the sha dir (its sha256 is in the manifest), never from a working tree:
#   sudo install -D -m 0644 /usr/local/lib/mal-h5-exec/<sha>/mal-h5-executor-live-pinned.conf /etc/systemd/system/mal-h5-executor.service.d/live.conf
#   sudo systemctl daemon-reload
# Live still needs BOTH switches: --live below AND "mode": "live" in the pinned h5-executor-live.json, plus the LIVE_OK file,
# EXP-024 Part 1 in the pinned tree and an explicit end_ms in that config. See docs/runbooks/h5-executor.md.
# Why a launcher and not `-m tools.h5_executor`: -I ignores PYTHONPATH and the working directory, so `-m` could not find the
# pinned tools package; the root-owned launcher puts only its own resolved directory on sys.path and runs the module.
# The user, EnvironmentFile, state dir, mounts and every hardening line are inherited from the base unit.
[Service]
LoadCredential=probe-wallet:/etc/mal-probe/probe-wallet.json
ExecStart=
ExecStart=/usr/local/lib/mal-h5-exec/venv/bin/python -I -B -u /usr/local/lib/mal-h5-exec/current/launcher.py --config /usr/local/lib/mal-h5-exec/current/h5-executor-live.json --live
